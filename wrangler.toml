# Cloudflare Pages project (site + /api Pages Functions).
name = "qrpc-results"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "qrpc-results"
# Paste the id printed by: npx wrangler d1 create qrpc-results
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Companion Worker: live polling only (Pages Functions cannot run on a schedule).
name = "qrpc-sync"
main = "index.ts"
compatibility_date = "2025-06-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "qrpc-results"
# Same id as in ../wrangler.toml
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"
